name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的 tag 时触发，如 v1.0.0

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "pyinstaller==6.17.0" pyyaml yamllint tkinterdnd2 pillow

    - name: Convert PNG to ICO
      run: |
        python -c "from PIL import Image; img = Image.open('icon/icon_transparent.png'); img.save('icon/icon.ico', format='ICO', sizes=[(256,256),(48,48),(32,32),(16,16)])"

    - name: Build EXE
      run: |
        # runtime-tmpdir=. : 运行时解压到 EXE 所在目录，不依赖 TEMP 环境变量，避免特殊环境下无法启动
        # add-data: 将图标打包进 EXE，供运行时设置窗口/任务栏图标使用
        pyinstaller --onefile --windowed --runtime-tmpdir . --add-data "icon/icon.ico;icon" --icon=icon/icon.ico --name UniVal unival.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: UniVal-Windows
        path: dist/UniVal.exe

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/UniVal.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
