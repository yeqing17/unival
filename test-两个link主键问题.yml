#!baseline
spec: '1.0'
template:
  alphav1.1:
    uuid: ${uuid}
    buildee: "android<gradle,sdk24,ndk20>"
    type: apk
    start: 2020-03-01+08
    close: 2029-03-02+08
    source:
    - url: ${REPO_URL}/app-apk/HomedSTBStandardOne.git                 # xuzx       主体代码模块  TV软终端源代码 
      tag: v1.0
      name: HomedSTB_standard_one
