      tag: develop-v1.0.2
      name: calibs
    - url: ${REPO_URL}/app-apk/TVMiddlewareTheme.git                                     # guohui & liangtao  theme资源模块   构建版本时替换指定theme
      tag:  v1.0.1
      copy: ["TVMiddlewareTheme/zggd/theme:HomedSTB_standard_one/res-assets/public/"]    # theme文件源路径:目标替换路径
    - url: ${REPO_URL}/web/WebAppScm.release.git/aar  #xinjiang webapp
      tag: 70098-v1.0
    - url: ${REPO_URL}/app-apk/TVMiddlewareResIcons.git
      tag: v1.0
      name: res-icons
    package: []
    configs: {publictoken: [691cfa5e07a216d8cd24dd8ec65ddf14a883d505], verifytoken: [067dbfba1011e95ef14790d7ca8b58e226241c6c]}
    build:
    - configs:
          sign-apk-id: [7e187310a42c479f8eb783cea71680b8]
          build-config:
          - IPANEL_CLOUD_DOMAIN:xjgdcloud.tsytv.com.cn               # iPanelCloud的域名
          - IPANEL_PULSE:true                                         # 是否启用心跳：true 开启，false 关闭
          - IPANEL_CLOUD_API:https://xjgdcloud.tsytv.com.cn:50443     # iPanelCloud API接口 URL地址前缀（域名）
          - IPANEL_CERT_PATH:/assets/ipanel_cert                      # iPanel自签证书存储路径
          - IPANEL_PULSEKEY_PATH:/assets/ipanel_publickey             # 用于心跳功能，往软终端里面内置 publickey
          - IPANEL_VERIFYKEY_PATH:/assets/ipanel_verifykey            # loading包验签的公钥的存储路径
          - int_DATA_CACHE_LEVEL:3                                    # 数据缓存级别：1 enable http cache；2 enable api cache；3 enable custom cache store for core api
          - int_SAVE_LOCAL_LOG:0
          - int_LOGIN_DEVICE_ID:2                                     #登录使用oid 
          - HOMED_HOST:tsyrmt.cn
          - CONFIG_PROXY_EXCLUDE:re:.*(homed\\.tv|ipanel\\.cn)$
          - HOMED_SLAVE_PATH:http://slave.%s
          - HOMED_ACCESS_PATH:http://access.%s
          - HOMED_WS_PATH:ws://access.%s:12698/chat
          - HOMED_COLLECT_PATH:http://collect.%s/collect/resource
          - THEME_CONFIG_URL:http://webclient.tsyrmt.cn/smarttv/theme/theme-E.json
          - ro_build_rzdsoftversion:R0000001
          - ro_build_compiletime:231016.23
          - USB_PROXY_TYPE:global
          - NETWORK_CONNECT:DHCP|
          - VGATEE_DHCP_OPTION60:HZCNCSTBV1
          - VGATEE_DHCP_OPTION60_EXT:HZCNCAMSV1
          - HOMED_STB_ABILITY:3|30|0|0|1|0|1
#          - U_NAME:qaidam_hotel
          gargs: [-PuseDlna=true -PuseChrome=true]                                        #投屏功能
          gradlename: [smarttvIjkAp_xinjiangChrome]
          producttype: [debug]
          pack_name: [xinjiang]
        link: [aar/.gitpack/pack.zip:HomedSTB_standard_one/aars/ipanel_browser.aar]
        link: [res-icons/xinjiang:HomedSTB_standard_one/res-icons/zggd]
        package:
        - {name: hubei_sign, packer: toolkit/pack/apk_sign, signer: toolkit/sign}
        - {name: xinjiang_public, packer: toolkit/pack/apk_debug, push: 1 }
    release:
        tag: alpha-v1.1



