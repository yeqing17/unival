      tag: alpha-v1.0
      name: maudio
    - url: ${REPO_URL}/git/playcube/playcube.release.git/loading       # lbyufei   播放服务基础功能模块  含包终端设备接入与数据传输管理、频道数据服务、CA功能、网络接入、网络代理数据服务等
      tag: alpha-v1.1
      name: playcube
    - url: ${REPO_URL}/app-apk/JoinUILibrary.git                       # xuzx      依赖模块  ui基础库
      tag: v1.0
    - url: ${REPO_URL}/app-apk/JoinProtocolLibrary.git                 # xuzx      依赖模块  协议处理库
      tag: v1.0
    - url: ${REPO_URL}/app-apk/HomedMediaPlayerExo.git                 # xuzx      媒体播放模块  EXO播放器
      tag: v1.0
      name: HomedMediaPlayer_exo
    - url: ${REPO_URL}/app-apk/DummyJointvLib.git                      # xuzx      依赖模块  jointv库
      tag: v1.0
    - url: ${REPO_URL}/app-apk/AODataLibraryIPTV.git                   # xuzx      依赖模块  IPTV库
      tag: v1.0
      name: AODataLibrary_IPTV
    - url: ${REPO_URL}/app-apk/XiriLibrary.git                         # xuzx      依赖模块  依赖的代码
      tag: v1.0
